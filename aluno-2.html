<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rebouças Training</title>
<meta name="description" content="Treinos, timer e acompanhamento — Rebouças Training">
<meta property="og:title" content="Rebouças Training">
<meta property="og:description" content="Seus treinos, timer e evolução. Toque para entrar.">
<meta property="og:image" content="https://reboucas-training.vercel.app/logo.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#141414">
<link rel="icon" type="image/png" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rebouças">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Tema do aluno: grafite. Tema do treinador (.coach): azul-marinho. Destaque: azul-lavanda da marca. */
:root{
  --bg:#141414;--bg2:#1a1a1a;--card:#1e1e1f;--card2:#2a2a2c;--line:#2f2f33;--field:#141415;
  --ink:#f2f2f3;--muted:#9a9aa1;--dim:#66666d;
  --acc:#8b9dff;--acc-ink:#0d1330;--acc-soft:rgba(139,157,255,.16);--acc2:#3fd0e0;
  --ok:#3ddc84;--warn:#ffc53d;--bad:#ff6b6b;--rest:#3b82f6;
  --f:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fc:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --hi:#fff;--hi-ink:#111;--blk:#161616;--bline:#333336;--rec:#26305a;--rec-ink:#cdd6ff;--navbg:rgba(44,44,47,.94);--navcur:#161617;--bar:#3a3a40;--sel:#1d2a55;--restbg:linear-gradient(150deg,#2c2c2f,#1d1d1f);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
body.coach{--bg:#0d1220;--bg2:#111829;--card:#141c2e;--card2:#1c2740;--line:#25314d;--field:#0f1626;--muted:#93a0bd;--dim:#5c6a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--f);color-scheme:dark}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 12px) 14px calc(var(--sb) + 110px);min-height:100vh}
body.coach #app{max-width:1280px;padding-bottom:calc(var(--sb) + 40px)}

/* ---------- comuns ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--dim)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.w{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.full{width:100%}
.btn.bad{color:var(--bad)}
.btn.plain{background:transparent;border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.circ{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--ink);flex:none}
.circ.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.in{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);outline:none}
.in:focus{border-color:var(--acc)}
.in.big{font:700 22px/1.2 var(--fc);letter-spacing:.02em}
textarea.in{resize:vertical;min-height:84px;line-height:1.5}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date].in{text-align:center}
.lab{display:block;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.lab:first-child{margin-top:0}
.hint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card+.card{margin-top:12px}
.ttl{font:700 30px/1 var(--fc);text-transform:uppercase;letter-spacing:.01em;margin:6px 0 14px}
.cap{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--card2);font-size:12px;font-weight:600;color:var(--muted)}
.pill.ok{background:rgba(61,220,132,.13);color:var(--ok)}
.pill.warn{background:rgba(255,197,61,.13);color:var(--warn)}
.pill.bad{background:rgba(255,107,107,.14);color:var(--bad)}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;min-height:34px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:0 8px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink)}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 15px/1 var(--fc);color:#fff;background:linear-gradient(135deg,#4f6bff,#3fd0e0)}
.av.s{width:30px;height:30px;font-size:13px}
.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.phbadge{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;border:2px solid var(--bg)}
.phbadge svg.i{width:13px;height:13px;stroke-width:2.4}
.banner{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;background:rgba(255,197,61,.1);color:var(--warn);font-size:13.5px;margin-bottom:12px}
.banner.info{background:var(--acc-soft);color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 100px);transform:translateX(-50%);background:var(--hi);color:var(--hi-ink);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:300;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:90vw;text-align:center}
.chk{width:20px;height:20px;accent-color:var(--acc);flex:none}
.prog{height:6px;border-radius:9px;background:var(--card2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:9px}

/* ---------- marca ---------- */
.logo{display:block;flex:none}
.brand{display:flex;align-items:center;gap:10px}
.word{line-height:1;font:700 21px/1 var(--fc);letter-spacing:.2em}
.word span{display:block;font:600 9.5px/1 var(--f);letter-spacing:.55em;color:var(--acc2);margin-top:4px}

/* ---------- splash / login ---------- */
.center{min-height:calc(100vh - 150px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* ---------- aluno ---------- */
.ahead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.mbtn{display:flex;align-items:center;gap:9px;height:44px;padding:0 18px 0 14px;border-radius:999px;background:var(--card);font-weight:700;font-size:14.5px;min-width:140px}
.weekbar{display:grid;grid-template-columns:22px repeat(7,1fr) 22px;align-items:center;text-align:center;margin:0 -6px 18px;touch-action:pan-y}
.weekbar>button.nv{color:var(--muted);height:40px;display:grid;place-items:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px}
.wd small{font-size:12px;color:var(--muted);font-weight:600}
.wd b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:600}
.wd.sel b{background:var(--hi);color:var(--hi-ink)}
.wd.today:not(.sel) b{box-shadow:inset 0 0 0 1.5px var(--dim)}
.wd i{font-style:normal;height:10px;font-size:10px;line-height:10px;color:var(--muted)}
.wd i.ok{color:var(--ok)}
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.pcard{position:relative;flex:0 0 88%;scroll-snap-align:center;aspect-ratio:1.58;border-radius:22px;overflow:hidden;text-align:left;background:linear-gradient(150deg,#b4b4b8 0%,#7d7d83 45%,#4a4a50 100%);border:3px solid rgba(255,255,255,.9);color:#fff}
.pcard:only-child{flex-basis:100%}
.pcard .logo{position:absolute;left:50%;top:37%;width:36%;height:auto;aspect-ratio:1;transform:translate(-50%,-50%);opacity:.95}
.pcard .t{position:absolute;left:20px;right:20px;bottom:52px;font:600 30px/1 var(--fc);text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .d{position:absolute;left:20px;bottom:20px;font-size:14px;font-weight:600}
.pcard .p{position:absolute;right:14px;bottom:13px;background:#1b1b1d;color:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .st{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font:italic 700 16px/1 Georgia,serif}
.pcard .st.done{background:var(--ok);color:#06210f;font:700 16px/1 var(--f)}
.pcard.rest{background:var(--restbg);border-color:var(--line);color:var(--ink)}
.pcard.rest .logo{opacity:.35}
.weekcard{margin-top:14px}
.weekcard .ttl{margin:4px 0 10px;font-size:28px}
.recado{background:var(--rec);color:var(--rec-ink);border-radius:10px;padding:10px 13px;font-size:14px;line-height:1.45}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 14px);width:min(520px,calc(100% - 28px));display:flex;justify-content:space-around;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:7px;z-index:40;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.nav button{flex:1;height:50px;border-radius:999px;display:grid;place-items:center}
.nav button[aria-current="true"]{background:var(--navcur)}
.nav svg.i{width:23px;height:23px}
.navdot{position:absolute;margin:-14px 0 0 18px;width:8px;height:8px;border-radius:50%;background:var(--acc)}

/* ---------- treino (aluno) ---------- */
.wtop{position:sticky;top:0;z-index:20;background:var(--bg);margin:calc(-12px - var(--st)) -14px 12px;padding:calc(var(--st) + 12px) 14px 10px;display:flex;align-items:center;gap:10px}
.backpill{display:flex;align-items:center;gap:4px;height:42px;padding:0 14px 0 10px;border-radius:999px;background:var(--card);font-weight:600;font-size:14px;flex:none}
.wtop .tt{flex:1;min-width:0}
.wtop .tt b{display:block;font:700 22px/1 var(--fc);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtop .tt small{font-size:12.5px;color:var(--muted)}
.block{background:var(--blk);border:2px solid var(--bline);transition:border-color .2s;border-radius:26px;margin-bottom:16px;overflow:hidden}
.bh{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 12px 0 0;border-bottom:1px solid var(--line)}
.tabck{align-self:stretch;flex:none;width:52px;min-height:48px;max-height:56px;background:var(--card2);transition:background .2s;border-radius:0 0 14px 0;display:grid;place-items:center;margin:-1px 0 0 -1px}
.block.done{border-color:var(--hi)}
.block.done .tabck{background:var(--hi)}
.tabck svg circle{stroke:#8a8a90}
.block.done .tabck svg circle,.block.done .tabck svg path{stroke:var(--hi-ink)}
.bh b{flex:1;font-size:17.5px;font-weight:700;letter-spacing:.005em;padding:14px 0}
.bh .tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btxt{padding:16px 16px 14px;white-space:pre-wrap;font-size:16px;line-height:1.85}
.dot{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:transparent}
.dot svg.i{width:17px;height:17px;stroke-width:3}
.btxt.clamp{max-height:17em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.more{padding:0 14px 12px;font-weight:600;font-size:14px}
.calcrow{margin:0 14px 12px;padding:10px 12px;border-radius:10px;background:var(--acc-soft);color:var(--rec-ink);font-size:13.5px}
.calcrow b{color:var(--ink)}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:14.5px;text-align:left}
.vids{display:flex;gap:10px;overflow-x:auto;padding:12px 14px;border-top:1px solid var(--line);scrollbar-width:none}
.vid{flex:0 0 46%;aspect-ratio:16/10;border-radius:10px;background:linear-gradient(135deg,#2a3354,#151a2c);position:relative;display:grid;place-items:center;text-decoration:none;color:#fff;overflow:hidden}
.vid .pl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.vid .pl svg{width:16px;height:16px}
.vid small{position:absolute;left:9px;bottom:7px;right:9px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resline{padding:0 14px 12px;display:flex;gap:8px;flex-wrap:wrap}
.score{font-weight:700;font-size:13.5px;background:var(--hi);color:var(--hi-ink);border-radius:999px;padding:4px 11px}
.closecard .ttl{font-size:28px}
.bigchk{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:8px 16px;border-radius:14px;border:2px solid var(--hi);font:700 18px/1.05 var(--fc);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.bigchk .lbl{flex:1}
.bigchk .dot{width:32px;height:32px;background:transparent;box-shadow:inset 0 0 0 2px var(--hi)}
.bigchk.on{border-color:var(--ok);background:rgba(61,220,132,.08)}
.bigchk.on .dot{background:var(--ok);box-shadow:none;color:#06210f}

/* ---------- folhas ---------- */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:14px 16px calc(var(--sb) + 18px);animation:up .22s ease-out}
.ov.mid{align-items:center;padding:16px}
.ov.mid .sheet{border-radius:20px;border-bottom:1px solid var(--line);max-width:640px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:-14px;background:var(--bg2);padding:4px 0 8px;z-index:2}
.shead .ttl{flex:1;margin:0;font-size:26px}
@keyframes up{from{transform:translateY(40px)}}
@keyframes fade{from{opacity:0}}
.bolts{display:flex;gap:6px}
.bolts button{flex:1;height:46px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}
.bolts button[aria-pressed="true"]{background:var(--card2)}
.bolts svg{width:22px;height:22px}
.tm{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.tm .in{text-align:center;font-weight:700;font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px;touch-action:pan-y}
.mgrid button.out{opacity:.38}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mgrid button{height:44px;border-radius:10px;font-size:16px;position:relative}
.mgrid button.sel{box-shadow:inset 0 0 0 1.5px var(--dim);background:var(--card2)}
.mgrid button i{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--muted)}
.mgrid button i.ok{background:var(--ok)}
.nicework{position:fixed;inset:0;z-index:120;background:linear-gradient(180deg,#fff 0%,#8f93a8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#111;padding:24px;animation:fade .25s}
.nicework .rg{width:124px;height:124px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 12px rgba(255,255,255,.7)}
.nicework .rg svg.i{width:58px;height:58px;stroke-width:3}
.nicework h2{font:700 44px/1 var(--fc);text-transform:uppercase}

/* ---------- evolução / progresso ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font:700 38px/1 var(--fc)}
.stat span{font-size:14px;color:var(--muted)}
.badge{opacity:.45}
.badge.on{opacity:1}
.badge.on svg.i{color:var(--warn)}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .c i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--bar);min-height:2px}
.chart .c.cur i{background:var(--acc)}
.chart .c small{font-size:11px;color:var(--muted)}
.chart .c em{font-style:normal;font-size:11.5px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:4px;height:70px}
.bars i{flex:1;border-radius:4px 4px 0 0;background:var(--acc);display:block}
.bars.e i{background:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:7px 8px;text-align:left}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:700}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:nth-child(even) td{background:rgba(255,255,255,.03)}
.rk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk b{flex:1;font-weight:600}
.rk .pos{width:24px;font:700 18px/1 var(--fc);color:var(--muted)}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;background:var(--card2);font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:5px}
.msg:not(.me){border-bottom-left-radius:5px}
.msg small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.msg .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;display:block;margin-bottom:2px}

/* ---------- treinador ---------- */
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.chead .sub{color:var(--muted);font-size:14px}
.ctabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.tabb{min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.tabb[aria-current="true"]{border-color:var(--hi)}
.sync{min-height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:rgba(61,220,132,.12);color:var(--ok)}
.sync.busy{background:var(--acc-soft);color:var(--acc)}
.sync.loc{background:rgba(255,197,61,.12);color:var(--warn)}
.ahd{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.achips{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.achip{flex:none;display:flex;align-items:center;gap:12px;min-width:230px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left}
.achip[aria-current="true"]{border-color:var(--acc);background:var(--sel)}
.achip b{display:block;font-weight:600}
.achip small{color:var(--muted);font-size:12.5px}
.cgrid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px;align-items:start;margin-top:8px}
@media (max-width:980px){.cgrid{grid-template-columns:1fr}}
.cgrid>div{display:flex;flex-direction:column;gap:12px;min-width:0}
.cgrid .card+.card{margin-top:0}
.wchips{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.wchip{flex:none;min-width:150px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left}
.wchip b{display:block;font:700 19px/1.1 var(--fc);letter-spacing:.02em}
.wchip small{display:block;color:var(--muted);font-size:13px}
.wchip em{font-style:normal;font-size:12px;font-weight:700;color:var(--warn)}
.wchip em.pub{color:var(--ok)}
.wchip[aria-current="true"]{border-color:var(--acc);background:var(--sel)}
.wchip.add{display:grid;place-items:center;min-width:110px;color:var(--muted);font-weight:700}
.wk{border-left:3px solid var(--acc)}
.wk .wkh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wk .wkh .in.big{flex:1 1 220px}
.bed{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg2);margin-top:12px}
.bed .top{display:flex;gap:8px;align-items:center}
.bed .top .in{font-weight:600}
.sq{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;flex:none;background:var(--card)}
.sq:disabled{opacity:.35}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.kpi b{display:block;font:700 36px/1 var(--fc);margin-top:8px}
.kpi span{font-size:13px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--card2);display:block}
.heat i.done{background:var(--ok)}
.heat i.miss{background:rgba(255,107,107,.55)}
.heat i.today{outline:1.5px solid var(--hi)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.copybox{font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all;max-height:200px;overflow:auto}
.rmrow{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;margin-top:8px}

function put(c,id,data){
  data=clean(data);

const wByDate=()=>MEMO.wbd||(MEMO.wbd=listRO('workouts').reduce((m,w)=>{(m[w.date]=m[w.date]||[]).push(w);return m},{}));
const wFor=(aid,date)=>(wByDate()[date]||[]).map(w=>Object.assign({},w)).filter(w=>w.date===date&&(w.target==='all'||w.target===aid)&&weekVisible(w)).sort((a,b)=>(a.order||a.createdAt||0)-(b.order||b.createdAt||0));
const logId=(wid,aid)=>wid+'__'+aid;
const logOf=(wid,aid)=>{const v=all('logs')[logId(wid,aid)];return v?Object.assign({},v,{id:logId(wid,aid)}):undefined};
const bDone=(l,bid)=>!!(l&&l.blocks&&l.blocks[bid]&&l.blocks[bid].done);
const isDone=(w,aid)=>{const l=logOf(w.id,aid);if(!l)return false;if(l.done)return true;const bl=w.blocks||[];return bl.length>0&&bl.every(b=>bDone(l,b.id))};
const dayState=(aid,date)=>{const ws=wFor(aid,date);if(!ws.length)return '';return ws.every(w=>isDone(w,aid))?'done':(date<today()?'miss':'todo')};
function weekFor(aid,date){const ks=list('weeks').filter(k=>k.visible&&(k.target===aid||k.target==='all')&&date>=k.start&&date<=addDays(k.start,6));return ks.find(k=>k.target===aid)||ks[0]||null}
function weekStats(aid,start){let wt=0,wd=0,bt=0,bd=0;for(let i=0;i<7;i++){wFor(aid,addDays(start,i)).forEach(w=>{wt++;if(isDone(w,aid))wd++;const l=logOf(w.id,aid);(w.blocks||[]).forEach(b=>{bt++;if((l&&l.done)||bDone(l,b.id))bd++})})}return{wt,wd,bt,bd}}
function compliance(aid,days){let p=0,d=0;for(let i=0;i<days;i++){const dt=addDays(today(),-i);wFor(aid,dt).forEach(w=>{p++;if(isDone(w,aid))d++})}return{p,d,pct:p?Math.round(d/p*100):null}}
function lastSession(aid){let best=null;listRO('logs').forEach(l=>{if(l.athleteId===aid&&(l.done||Object.values(l.blocks||{}).some(b=>b.done))){if(!best||l.date>best)best=l.date}});return best}

const numOf=v=>{const m=/(\d+(?:[.,]\d+)?)/.exec(String(v==null?'':v));return m?Number(m[1].replace(',','.')):null};
function refBase(b,aid,l){
  const e=l&&l.blocks&&l.blocks[b.id];
  if(e&&e.refVal)return{name:b.ref||'Referência',val:Number(e.refVal),src:'ajustado por você'};
  if(numOf(b.refVal)!=null)return{name:b.ref||'Referência',val:numOf(b.refVal),src:'do treinador'};
  if(b.ref){const a=getD('athletes',aid);const k=norm(b.ref);const rms=(a&&a.rms)||[];
    const rm=rms.find(r=>norm(r.name)===k)||rms.find(r=>norm(r.name)&&(norm(r.name).includes(k)||k.includes(norm(r.name))));
    if(rm&&Number(rm.value))return{name:rm.name,val:Number(rm.value),src:'seu RM'};
    const pr=list('prs').filter(p=>p.athleteId===aid&&(p.unit||'kg')==='kg'&&(norm(p.name)===k||norm(p.name).includes(k)||k.includes(norm(p.name)))).sort((x,y)=>y.value-x.value)[0];
    if(pr)return{name:pr.name,val:pr.value,src:'seu PR'};
    return{name:b.ref,val:null};}
  return null;
}
const kg=x=>{const r=Math.round(x*2)/2;return String(r).replace('.',',')};
function pctLoads(text,base){
  const out=[],seen={};const re=/(\d{1,3})\s*(?:%\s*)?(?:[-–]|a)\s*(\d{1,3})\s*%|(\d{1,3})\s*%/g;let m;
  while((m=re.exec(text||''))){const lo=+(m[1]||m[3]),hi=m[2]?+m[2]:null;if(lo>150||(hi&&hi>150))continue;const k=lo+'-'+hi;if(seen[k])continue;seen[k]=1;
    out.push((hi?lo+'–'+hi+'%':lo+'%')+' = <b>'+(hi?kg(base*lo/100)+'–'+kg(base*hi/100):kg(base*lo/100))+' kg</b>')}
  return out;
}
function blockVideos(b){
  const vs=[],urls={};
  String(b.videos||'').split('\n').forEach((ln,i)=>{ln=ln.trim();if(!ln)return;let name='',url=ln;if(ln.includes('|')){const p=ln.split('|');name=p[0].trim();url=p.slice(1).join('|').trim()}
    if(!/^https?:\/\//i.test(url))return;if(urls[url])return;urls[url]=1;vs.push({name:name||'Vídeo '+(vs.length+1),url})});
  const t=norm((b.text||'')+' '+(b.name||''));
  list('library').forEach(x=>{if(!x.name||!x.url||!/^https?:\/\//i.test(x.url))return;if(t.includes(norm(x.name))&&!urls[x.url]){urls[x.url]=1;vs.push({name:x.name,url:x.url})}});
  return vs;
}

const HSCROLL='.cards,.wchips,.achips,.vids,.ctabs,.chips';
let lastCtx='';
function draw(){
  const app=$('#app');
  const ae=document.activeElement;let keep=null;
  if(ae&&ae.id&&app.contains(ae)&&('value' in ae)&&ae.type!=='checkbox')keep={id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd};
  const sy=window.scrollY;
  const coach=UI.role==='coach'&&!UI.preview;
  document.body.classList.toggle('coach',coach);
  let html='';
  if(UI.role==='loading')html=vSplash();
  else if(UI.role==='choose')html=vChoose();
  else if(coach)html=vCoach();
  else if(UI.role==='athlete'&&!me()&&cloudOn&&!loaded)html=vSplash();
  else if(UI.role==='login'||!me())html=vLogin();
  else html=vAthlete();
  const ctx=UI.role+'|'+UI.aid+'|'+UI.sel+'|'+UI.open+'|'+UI.aTab+'|'+UI.cTab+'|'+UI.cSel;
  const hs=ctx===lastCtx?[...app.querySelectorAll(HSCROLL)].map(e=>e.scrollLeft):[];lastCtx=ctx;
  app.innerHTML=html;
  if(hs.length){const els=app.querySelectorAll(HSCROLL);if(els.length===hs.length)els.forEach((e,i)=>{if(hs[i])e.scrollLeft=hs[i]})}
  if(keep){const el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus({preventScroll:true});try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
  if(Math.abs(window.scrollY-sy)>2)window.scrollTo(0,sy);
}

function streak(aid){const ok=new Set();listRO('logs').forEach(l=>{if(l.athleteId===aid&&isDoneLog(l))ok.add(l.date)});let n=0,d=today();if(!wFor(aid,d).some(w=>isDone(w,aid)))d=addDays(d,-1);for(let i=0;i<400;i++){if(ok.has(d))n++;else break;d=addDays(d,-1)}return n}
function isDoneLog(l){const w=getD('workouts',l.workoutId);return w?isDone(w,l.athleteId):!!l.done}
function vEvo(){
  const aid=UI.aid;const goal=LS.get('rt_goal_'+aid,3);const ws=wkStart(today());const st=weekStats(aid,ws);
  const weeks=[];for(let i=7;i>=0;i--){const s=addDays(ws,-7*i);weeks.push({s,st:weekStats(aid,s)})}
  const mx=Math.max(goal,...weeks.map(x=>x.st.wd),1);
  const logs=list('logs').filter(l=>l.athleteId===aid);
  const doneW=logs.filter(isDoneLog).length;
  let doneB=0;logs.forEach(l=>{const w=getD('workouts',l.workoutId);if(!w)return;(w.blocks||[]).forEach(b=>{if(l.done||bDone(l,b.id))doneB++})});
  const fullWeeks=weeks.filter(x=>x.st.wt>0&&x.st.wd===x.st.wt).length;
  const sk=streak(aid);
  const badges=[['Primeiro treino',doneW>=1],['3 treinos feitos',doneW>=3],['5 treinos feitos',doneW>=5],['10 treinos feitos',doneW>=10],['25 treinos feitos',doneW>=25],['Semana completa',fullWeeks>=1],['Sequência de 3',sk>=3],['Sequência de 7',sk>=7]];
  // ranking do dia
  let rk='';wFor(aid,today()).forEach(w=>(w.blocks||[]).forEach(b=>{if(!b.score||b.score==='none')return;const rows=rankingFor(w,b);if(!rows.length)return;
    rk+='<div class="card"><div class="cap">Ranking de hoje · '+esc(b.name)+'</div>'+rows.slice(0,10).map((r,i)=>'<div class="rk"><span class="pos">'+(i+1)+'</span>'+av(r.aid,'s')+'<b>'+(r.aid===aid?'(Você) ':'')+esc(aName(r.aid))+'</b><span class="score">'+esc(scoreDisp(b.score,r.score))+(r.scaled?' · A':'')+'</span></div>').join('')+'</div>'}));
  const ps=list('prs').filter(p=>p.athleteId===aid);
  const best={};ps.forEach(p=>{const k=norm(p.name);if(!best[k]||(p.unit==='s'?p.value<best[k].value:p.value>best[k].value))best[k]=p});
  const bl=Object.values(best).sort((a,b)=>b.date.localeCompare(a.date));
  return '<div class="ttl">Evolução</div>'+
   '<div class="card"><div class="cap">Meta da semana</div><div class="row" style="margin-top:6px"><div class="grow"><b style="font:700 34px/1 var(--fc)">'+st.wd+'/'+goal+'</b><div class="muted small">treinos feitos esta semana</div></div><button class="sq" data-act="goal" data-v="-1" aria-label="Diminuir meta">−</button><button class="sq" data-act="goal" data-v="1" aria-label="Aumentar meta">+</button></div><div class="prog" style="margin-top:14px"><i style="width:'+Math.min(100,Math.round(st.wd/goal*100))+'%"></i></div><p class="hint">'+(st.wd>=goal?'Meta batida! 🎯':'Faltam '+(goal-st.wd)+' treino(s) para bater a meta.')+'</p></div>'+
   '<div class="card"><div class="cap">Treinos por semana</div><div class="chart">'+weeks.map((x,i)=>'<div class="c'+(i===7?' cur':'')+'"><em>'+(x.st.wd||'')+'</em><i style="height:'+Math.round(x.st.wd/mx*100)+'%"></i><small>'+pad(parseD(x.s).getDate())+'/'+pad(parseD(x.s).getMonth()+1)+'</small></div>').join('')+'</div><p class="hint">Últimas 8 semanas (a barra azul é a atual).</p></div>'+
   '<div class="cap" style="margin:22px 0 10px">Conquistas</div><div class="stats"><div class="stat"><b>'+sk+'</b><span>Sequência atual (dias)</span></div><div class="stat"><b>'+doneW+'</b><span>Treinos feitos</span></div><div class="stat"><b>'+doneB+'</b><span>Blocos feitos</span></div><div class="stat"><b>'+fullWeeks+'</b><span>Semanas completas</span></div>'+
   badges.map(b=>'<div class="stat badge'+(b[1]?' on':'')+'">'+ic('trophy')+'<div style="font-weight:600;margin-top:8px">'+b[0]+'</div><span class="small">'+(b[1]?'Conquistado':'Bloqueado')+'</span></div>').join('')+'</div>'+
   (rk?'<div style="margin-top:12px">'+rk+'</div>':'')+
   '<div class="card" style="margin-top:12px"><div class="cap">Registrar PR</div><label class="lab" for="prN">Exercício</label><input class="in" id="prN" list="liftList" placeholder="ex: 1RM Back Squat"><datalist id="liftList">'+LIFTS.map(l=>'<option value="1RM '+l+'">').join('')+'</datalist>'+
   '<div class="row" style="margin-top:12px;align-items:flex-end"><div class="grow"><label class="lab" for="prV">Valor'+(UI.prUnit==='s'?' (mm:ss)':'')+'</label><input class="in" id="prV" inputmode="decimal" placeholder="'+(UI.prUnit==='s'?'21:30':'120')+'"></div><div class="seg" style="flex:1.3">'+[['kg','kg'],['reps','reps'],['s','tempo'],['m','m']].map(u=>'<button data-act="prUnit" data-v="'+u[0]+'" aria-pressed="'+(UI.prUnit===u[0])+'">'+u[1]+'</button>').join('')+'</div></div>'+
   '<label class="lab" for="prD">Data</label><input class="in" id="prD" type="date" value="'+today()+'"><label class="lab" for="prO">Observação (opcional)</label><input class="in" id="prO" placeholder="Ex.: sem cinto, com straps…"><button class="btn acc" style="margin-top:14px" data-act="prSave">Salvar PR</button></div>'+
   '<div class="card"><div class="cap">Meus PRs</div>'+(bl.length?bl.map(p=>'<button class="rk" style="width:100%;text-align:left" data-act="editPR" data-id="'+p.id+'"><b>'+esc(p.name)+'<span class="muted small" style="display:block;font-weight:500">'+fmtD(p.date)+(p.note?' · '+esc(p.note):'')+'</span></b><b style="flex:none;font:700 22px/1 var(--fc)">'+esc(prDisp(p))+'</b></button>').join(''):'<p class="muted small" style="margin-top:6px">Nenhum PR registrado ainda. Salve o primeiro acima.</p>')+'</div>';
}
const prDisp=p=>p.unit==='s'?mmss(p.value):String(p.value).replace('.',',')+' '+(p.unit||'kg');
const LIFTS=['Back Squat','Front Squat','Deadlift','Clean','Power Clean','Clean & Jerk','Snatch','Power Snatch','Hang Snatch','Strict Press','Push Press','Push Jerk','Split Jerk','Bench Press','Overhead Squat','Thruster'];

function rankingFor(w,b){
  const rows=[];
  list('logs').forEach(l=>{if(l.workoutId!==w.id)return;const e=l.blocks&&l.blocks[b.id];if(!e||e.score==null||e.score==='')return;rows.push({aid:l.athleteId,score:Number(e.score),scaled:!!e.scaled})});
  rows.sort((x,y)=>(x.scaled-y.scaled)||better(b.score,x.score,y.score));return rows;
}

function chatBox(aid){

  const ws=list('workouts').filter(w=>w.weekId===k.id).sort((a,b)=>a.date.localeCompare(b.date)||(a.order||a.createdAt||0)-(b.order||b.createdAt||0));
  const defD=UI.nwDay&&UI.nwDay>=k.start&&UI.nwDay<=addDays(k.start,6)?UI.nwDay:(today()>=k.start&&today()<=addDays(k.start,6)?today():k.start);const days=[];for(let i=0;i<7;i++){const dt=addDays(k.start,i);days.push('<option value="'+dt+'"'+(dt===defD?' selected':'')+'>'+fmtDs(dt)+'</option>')}

   (k.visible?'':'<p class="hint" style="color:var(--warn)">Rascunho: o aluno ainda não vê esta semana. Marque "Visível para o aluno" para publicar.</p>')+'</div>'+

function cWorkout(w,target){

  else{const l=logOf(id,target);status=isDone(w,target)?'<span class="pill ok">Concluído</span>':'<span class="pill">Pendente</span>';
    if(l&&(l.feeling||l.comment))status+=' <span class="pill acc">'+esc(l.feeling||'')+(l.comment?' · comentou':'')+'</span>'}

function cOverview(){

  const todayDone=as.filter(a=>wFor(a.id,t).some(w=>isDone(w,a.id))).length;
  const cks=list('checkins').filter(c=>c.date===t);
  const avgE=cks.length?(cks.reduce((s,c)=>s+(c.energy||0),0)/cks.length).toFixed(1).replace('.',','):'—';
  const alerts=[];
  as.forEach(a=>{const ls=lastSession(a.id),lc=lastCheck(a.id),c=compliance(a.id,7);
    if(lc&&lc.date>=addDays(t,-2)&&((lc.mood&&lc.mood<=2)||(lc.energy&&lc.energy<=2)))alerts.push({a,txt:'Check-in: '+(lc.feel||'')+' · energia '+(lc.energy||'–')+'/5',k:'bad'});
    if(c.p>=2&&c.pct<50)alerts.push({a,txt:'Aderência de '+c.pct+'% nos últimos 7 dias',k:'warn'});
    if(c.p>0&&(!ls||ls<addDays(t,-4)))alerts.push({a,txt:ls?'Último treino em '+fmtDs(ls):'Ainda não registrou treinos',k:'warn'})});
  const feed=list('logs').filter(l=>l.updatedAt).sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,15);
  return '<div class="kpis"><div class="kpi"><small>Alunos</small><b>'+as.length+'</b><span>cadastrados</span></div><div class="kpi"><small>Treinaram hoje</small><b>'+todayDone+'</b><span>de '+as.length+'</span></div><div class="kpi"><small>Aderência · 7 dias</small><b>'+(pres?Math.round(done/pres*100)+'%':'—')+'</b><span>'+done+' de '+pres+' treinos</span></div><div class="kpi"><small>Energia média hoje</small><b>'+avgE+'</b><span>'+cks.length+' check-in(s)</span></div></div>'+

   '<div><div class="cap" style="margin-bottom:10px">Últimos registros</div>'+(feed.length?'<div class="list">'+feed.map(l=>{const w=getD('workouts',l.workoutId);if(!w)return '';

     return '<button class="li" style="align-items:flex-start" data-act="cSel" data-v="'+l.athleteId+'">'+av(l.athleteId,'s')+'<span class="grow"><b>'+esc(aName(l.athleteId))+'</b> <span class="muted small">· '+esc(w.title||'Treino')+' · '+fmtDs(w.date)+'</span>'+(isDone(w,l.athleteId)?' <span class="pill ok">Concluído</span>':'')+(l.feeling?' <span class="pill acc">'+esc(l.feeling)+'</span>':'')+sc+(l.comment?'<div class="small">💬 '+esc(l.comment)+'</div>':'')+'</span><span class="muted small">'+ago(l.updatedAt)+'</span></button>'}).join('')+'</div>':'<div class="card empty small">Os registros dos alunos aparecem aqui.</div>')+'</div></div>';

let CA={tab:'rep',w:100,r:1,v:100,pace:'05:00'};
function drawCalc(full){
  let body='';
  const r2=x=>Math.round(x*4)/4;
  if(CA.tab==='rep'){
    const W=Number(CA.w)||0,R=Math.max(1,Math.min(20,Math.round(Number(CA.r)||1)));const orm=W*Math.pow(R,0.10);let rows='';
    for(let i=1;i<=20;i+=2)rows+='<tr><td>'+i+'RM</td><td class="r"><b>'+r2(orm/Math.pow(i,.1))+' kg</b></td><td>'+(i+1)+'RM</td><td class="r"><b>'+r2(orm/Math.pow(i+1,.1))+' kg</b></td></tr>';
    body='<div class="row"><div class="grow"><label class="lab" for="caW">Carga (kg)</label><input class="in" id="caW" data-in="caW" type="number" inputmode="decimal" value="'+CA.w+'"></div><div class="grow"><label class="lab" for="caR">Repetições (1-20)</label><input class="in" id="caR" data-in="caR" type="number" inputmode="numeric" min="1" max="20" value="'+CA.r+'"></div></div><div class="card" style="margin-top:12px;padding:6px"><table class="tbl">'+rows+'</table></div><p class="muted small" style="text-align:center;margin-top:8px">Estimativas pela fórmula de Lombardi.</p>';
  }else if(CA.tab==='pct'){
    let rows='';for(let p=100;p>=5;p-=10)rows+='<tr><td>'+p+'%</td><td class="r"><b>'+r2((Number(CA.v)||0)*p/100)+'</b></td><td>'+(p-5)+'%</td><td class="r"><b>'+r2((Number(CA.v)||0)*(p-5)/100)+'</b></td></tr>';
    body='<label class="lab" for="caV">Valor (ex: seu 1RM)</label><input class="in" id="caV" data-in="caV" type="number" inputmode="decimal" value="'+CA.v+'"><div class="card" style="margin-top:12px;padding:6px"><table class="tbl">'+rows+'</table></div>';
  }else{
    const m=/^(\d{1,2}):?(\d{2})$/.exec(CA.pace.trim());const ps=m?(+m[1])*60+(+m[2]):300;
    const ds=[];for(let k=1;k<=42;k++){ds.push([k+' km',k]);if(k===5)ds.splice(ds.length-1,1,['5 km',5]);if(k===21)ds.push(['Meia (21,1)',21.0975])}ds.push(['Maratona',42.195]);
    body='<label class="lab" for="caP">Pace (min/km)</label><input class="in" id="caP" data-in="caP" inputmode="numeric" value="'+esc(CA.pace)+'" placeholder="05:00"><div class="card" style="margin-top:12px;padding:6px"><table class="tbl"><tr><th>Distância</th><th class="r">'+mmss(ps-5)+'</th><th class="r">'+mmss(ps)+'</th><th class="r">'+mmss(ps+5)+'</th></tr>'+ds.map(d=>'<tr><td>'+d[0]+'</td><td class="r">'+mmss(d[1]*(ps-5))+'</td><td class="r"><b>'+mmss(d[1]*ps)+'</b></td><td class="r">'+mmss(d[1]*(ps+5))+'</td></tr>').join('')+'</table></div>';
  }
  const shell=$('#calcBody');
  if(shell&&!full){const tmp=document.createElement('div');tmp.innerHTML=body;const o=tmp.querySelector('.card');const cur=shell.querySelector('.card');if(o&&cur)cur.replaceWith(o);return}
  sheet(shead('Calculadoras','<button class="btn sm" data-act="caReset">Limpar</button>')+'<div class="seg" style="margin:8px 0 4px">'+[['rep','Conversor RM'],['pct','Porcentagem'],['pace','Pace']].map(t=>'<button data-act="caTab" data-v="'+t[0]+'" aria-pressed="'+(CA.tab===t[0])+'">'+t[1]+'</button>').join('')+'</div><div id="calcBody">'+body+'</div>');
}

const SND={};let sndReady=false,actx=null;
function wav(parts,vol){ // parts: [[freq,dur],...] freq 0 = silêncio
  const sr=22050;let n=0;parts.forEach(p=>n+=Math.round(p[1]*sr));
  const buf=new ArrayBuffer(44+n*2),dv=new DataView(buf);
  const ws=(o,t)=>{for(let i=0;i<t.length;i++)dv.setUint8(o+i,t.charCodeAt(i))};

function paintRun(){
  if(!TR)return;const el=$('#tmr');if(!el)return;
  const e=tElapsed();
  let cls='tmr running',ph='',rd='',big,sub='',pb=0;
  if(TR.total!==Infinity&&e>=TR.total){
    if(!TR.fin){TR.fin=true;play('end');say('Fim!');clearInterval(ivl)}
    cls+=' fin';ph='Fim!';big=fmtBig(TM.mode==='stopwatch'?TM.cap:0);
    if(TM.mode==='down')sub=TR.amrap?TR.amrap+' rounds completos':'Bom trabalho!';
    else sub='Total '+mmss(TR.total-(TM.pre||0));
    pb=100;
  }else{
    const L=locate(e);const sg=L.sg;
    if(L.i!==TR.lastSeg){ // troca de fase
      if(TR.lastSeg>=0||sg.t!=='pre'){
        if(sg.t==='rest'){play('rest');say('Descanso')}
        else if(sg.t==='work'||sg.t==='up'){play('go');say(TM.mode==='emom'&&sg.r>1?(TM.emInt===60?'Minuto '+sg.r:'Round '+sg.r):TM.mode==='tabata'&&sg.r>1?'Round '+sg.r:'Vai!')}
      }

    }
    const rem=sg.d-L.inS;const remS=Math.ceil(rem);
    if(sg.t!=='up'&&remS<=3&&remS>=1&&TR.lastSec!==remS)play('tick');
    if(sg.t==='up'&&TM.cap&&remS<=3&&remS>=1&&TR.lastSec!==remS)play('tick');
    if(sg.t==='up'){const mn=Math.floor(L.inS/60);if(mn>TR.lastMin){TR.lastMin=mn;play('min')}}
    if(TM.mode==='down'&&sg.t==='work'&&sg.d>=120){const half=Math.ceil(sg.d/2);if(remS===half&&TR.lastSec!==remS)say('Metade do tempo')}
    TR.lastSec=remS;
    if(sg.t==='pre'){cls+=' pre';ph='Prepare-se';big=fmtBig(remS);sub=modeName(TM.mode)+' · '+tmSummary()}
    else if(sg.t==='up'){cls+=' work';ph='Vai!';big=fmtBig(L.inS,true);sub=TM.cap?'Time cap '+mmss(TM.cap):'';pb=TM.cap?L.inS/TM.cap*100:0}
    else{
      cls+=sg.t==='rest'?' rest':' work';
      ph=sg.t==='rest'?'Descanso':(TM.mode==='down'?'AMRAP':'Trabalho');
      if(TM.mode==='emom')ph=TM.emInt===60?'Minuto '+sg.r:'EMOM';
      rd=TM.mode==='down'?(TR.amrap?TR.amrap+' rounds':''):'Round '+sg.r+' / '+sg.n;
      big=fmtBig(remS);
      const workE=e-(TM.pre||0);sub='Decorrido '+mmss(workE)+' · Total '+mmss(TR.total-(TM.pre||0));
      pb=L.inS/sg.d*100;
    }
  }
  el.className=cls;
  const set=(id,v,html)=>{const x=document.getElementById(id);if(x){if(html){if(x.innerHTML!==v)x.innerHTML=v}else if(x.textContent!==v)x.textContent=v}};
  set('tPh',ph);set('tRd',rd);set('tDg',big.t,true);set('tSub',sub);

}

function savePhoto(file){
  if(!/^image\//.test(file.type)){toast('Escolha uma imagem');return}
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{try{const S=320,c=document.createElement('canvas');c.width=S;c.height=S;const s=Math.min(img.width,img.height);const x=(img.width-s)/2,y=(img.height-s)/2;
    const g=c.getContext('2d');g.drawImage(img,x,y,s,s,0,0,S,S);const data=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(url);
    const id=UI._phId;closeSheet();put('photos',id,{img:data,updatedAt:Date.now()});toast('Foto atualizada')}catch(e){toast('Não foi possível usar esta foto')}};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Formato de imagem não suportado')};
  img.src=url;
}

async function importRT(t){
  const m=/RT1:([A-Za-z0-9+/=]+)/.exec(t||'');if(!m){toast('Código RT1 não encontrado');return -1}
  let o;try{o=JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){toast('Código inválido');return -1}
  if(!o||!o.d||!getD('athletes',o.a)){toast('Aluno não encontrado');return -1}
  let n=0;for(const c of ['workouts','logs','checkins','prs','msgs']){for(const x of (o.d[c]||[])){const id=String(x._id||'');if(!/^[A-Za-z0-9_.~:@+-]+$/.test(id))continue;const v=Object.assign({},x);delete v._id;
    if(c==='msgs'){const cur=getD('msgs',id);const items=((cur&&cur.items)||[]).slice();(v.items||[]).forEach(it=>{if(!items.some(y=>y.ts===it.ts&&y.text===it.text))items.push(it)});items.sort((a,b)=>a.ts-b.ts);v.items=items.slice(-300);v.seen=cur&&cur.seen}
    if(c==='workouts'?v.target!==o.a:v.athleteId!==o.a)continue;
    put(c,id,v);n++}}
  return n;
}

function bindChange(el){
  const p=el.dataset.b.split('|');const val=el.type==='checkbox'?el.checked:el.value;
  const t=p[0],id=p[1];
  if(t==='a'){
    if(p[2]==='code'){const c=String(val).trim().toUpperCase();if(!c||list('athletes').some(x=>x.id!==id&&String(x.code).toUpperCase()===c)){toast('Código vazio ou já usado');el.value=getD('athletes',id).code;return}return patch('athletes',id,a=>{a.code=c})}
    if(p[2]==='name'&&!String(val).trim()){el.value=getD('athletes',id).name;return}
    return patch('athletes',id,a=>{a[p[2]]=String(val).trim()});
  }
  if(t==='rm')return patch('athletes',id,a=>{a.rms=a.rms||[];const r=a.rms[+p[2]];if(r)r[p[3]]=p[3]==='value'?(numOf(val)==null?'':numOf(val)):String(val).trim()});
  if(t==='wk'){
    if(p[2]==='start'){if(!val)return;const k=getD('weeks',id);const ns=wkStart(val);const dd=dayDiff(k.start,ns);if(!dd){el.value=k.start;return}
      list('workouts').filter(w=>w.weekId===id).forEach(w=>patch('workouts',w.id,x=>{x.date=addDays(w.date,dd)}));return patch('weeks',id,x=>{x.start=ns})}
    if(p[2]==='visible'){toast(val?'Semana publicada para o aluno':'Semana em rascunho')}
    return patch('weeks',id,x=>{x[p[2]]=val});
  }
  if(t==='w'){if(p[2]==='date'&&!val)return;return patch('workouts',id,w=>{w[p[2]]=val})}
  if(t==='b')return patch('workouts',id,w=>{const b=(w.blocks||[]).find(x=>x.id===p[2]);if(!b)return;if(p[3]==='placar')b.score=val?(b.score&&b.score!=='none'?b.score:'reps'):'none';else b[p[3]]=val});
  if(t==='lib')return patch('library',id,x=>{x[p[2]]=String(val).trim()});
  if(t==='s')return patch('settings','main',x=>{x[p[2]]=String(val).trim()});
}

function onInput(el){
  const k=el.dataset.in;
  if(k==='nwDay'){UI.nwDay=el.value}
  else if(k==='nwTpl'){UI.nwTpl=el.value}
  else if(k==='caW'){CA.w=el.value;drawCalc()}
  else if(k==='caR'){CA.r=el.value;drawCalc()}
  else if(k==='caV'){CA.v=el.value;drawCalc()}
  else if(k==='caP'){CA.pace=el.value;if(/^\d{1,2}:?\d{2}$/.test(el.value.trim()))drawCalc()}
  else if(k==='tf'){const key=el.dataset.k;const m=Number($('#tf_'+key+'_m').value)||0,s=Math.min(59,Number($('#tf_'+key+'_s').value)||0);TM[key]=Math.max(key==='cap'||key==='rest'?0:1,m*60+s);saveTM();const sm=$('#tSum');if(sm)sm.textContent=tmSummary()}
  else if(k==='nf'){TM[el.dataset.k]=Math.max(1,Math.min(99,Number(el.value)||1));saveTM();const sm=$('#tSum');if(sm)sm.textContent=tmSummary()}
}

  else if(s.z==='day'){UI.sel=addDays(UI.sel,dir);swiped();render()}
  else if(s.z==='cards'){const el=s.el,max=el.scrollWidth-el.clientWidth;if((dir>0&&s.sl>=max-4)||(dir<0&&s.sl<=4)){UI.sel=addDays(UI.sel,dir);swiped();render()}}
  else if(s.z==='month'&&MC){MC.m+=dir;if(MC.m<0){MC.m=11;MC.y--}if(MC.m>11){MC.m=0;MC.y++}swiped();drawMonth()}},{passive:true});
function swiped(){swipeTs=Date.now()}
window.addEventListener('hashchange',()=>{const s=FORCE_STUDENT||/^#?aluno$/i.test(location.hash||'');if(s!==studentOnly){studentOnly=s;if(UI.role!=='loading'){decideRole();render()}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TR&&!wakeLock){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{})}catch(e){}}});

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
function decideRole(){
  if(studentOnly){UI.role=UI.aid?'athlete':'login';UI.preview=false;return}
  if(isOwner){UI.role='coach';return}
  if(fbOn){UI.role=UI.aid?'athlete':'login';return}
  if(!cloudOn){const r=LS.get('rt_role','');UI.role=r==='coach'?'coach':r==='athlete'?(UI.aid?'athlete':'login'):'choose';return}
  UI.role=UI.aid?'athlete':'login';
}
async function init(){
  UI.role='loading';render();
  const hasClaude=!!(window.claude&&window.claude.use);
  let u=null,d=null;
  if(hasClaude){try{[u,d]=await Promise.all([window.claude.use('user').catch(()=>null),window.claude.use('db').catch(()=>null)])}catch(e){}}
  else{const cfg=fbCfg();if(cfg){try{d=await initFirebase(cfg)}catch(e){fbErr='Não foi possível conectar ao servidor. Verifique a internet e tente de novo.';try{console.warn(e)}catch(x){}}}}
  user=u;db=d;
  if(user){try{isOwner=!!(await user.isOwner())}catch(e){}try{const cw=await user.can('data.write');if(cw===false)canWrite=false}catch(e){}}
  if(db){
    cloudOn=true;
    const timer=setTimeout(()=>{if(!loaded){loadNote='Os dados ainda não carregaram — verifique a conexão.';render()}},10000);
    const pending=new Set(COLS);
    COLS.forEach(c=>{try{db.collection(c).onSnapshot({includeMetadataChanges:true},s=>{const o={};s.docs.forEach(x=>{if(x.exists!==false)o[x.id]=x.data()});CLOUD[c]=o;inv();
        if(!s.metadata||!s.metadata.fromCache){pending.delete(c);if(!pending.size&&!loaded){loaded=true;loadNote='';clearTimeout(timer)}}
        if(UI.role==='login'&&UI.aid&&getD('athletes',UI.aid))UI.role='athlete';
        if(loaded)softRender();else render()},err=>{pending.delete(c);if(!pending.size){loaded=true;clearTimeout(timer)}if(err&&err.code==='revoked')cloudOn=false;render()})}catch(e){pending.delete(c)}});
  }else loaded=true;
  decideRole();
  if(UI.role==='athlete'&&loaded&&!me())UI.role='login';
  render();
}
function applyTheme(){const hr=new Date().getHours();const light=hr>=7&&hr<18;document.body.classList.toggle('light',light);const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',light?'#f3f4f7':'#141414')}
applyTheme();setInterval(applyTheme,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyTheme()});
init();
})();
</script>
